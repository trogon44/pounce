[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pounce"
version = "0.1.0"
description = "Pooled barcode screen analysis: long-read variant mapping + short-read enrichment"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.81",
    "click>=8.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "pysam>=0.21",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
]

[project.scripts]
pounce = "pounce.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["pounce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
